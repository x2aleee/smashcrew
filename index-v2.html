<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smash Crew · Smash Burger a Civitanova Marche</title>
<meta name="description" content="Smash burgeria a Civitanova Marche, Via Regina Elena 56. Smash burger, hot dog e fritti: ordina su WhatsApp o Deliveroo, dal martedì alla domenica 19–23.">
<meta name="theme-color" content="#0a0705">
<link rel="preload" href="assets/burger.png" as="image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sofia+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0705;
  --bg-2:#150d06;
  --ink:#f7f2e7;
  --muted:#c9b998;
  --yellow:#ffc61a;
  --amber:#ff9a1a;
  --orange:#ff7a1a;
  --red:#e8402a;
  --stroke:3px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Sofia Sans",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.5;
  overflow-x:hidden;
}
a{color:var(--yellow)}
img,svg{display:block}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:4px}
.skip{
  position:absolute;left:-9999px;top:0;background:var(--yellow);color:#0a0705;
  padding:10px 16px;font-weight:800;z-index:100;border-radius:0 0 8px 0;
}
.skip:focus{left:0}

/* ---------- HEADER ---------- */
header{
  position:fixed;top:0;left:0;right:0;z-index:60;
  background:linear-gradient(rgba(10,7,5,.9),rgba(10,7,5,0));
  transition:background .3s ease;
}
header.solid{background:rgba(10,7,5,.94);border-bottom:2px solid rgba(255,198,26,.16)}
.head-in{
  max-width:1320px;margin:0 auto;padding:14px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;
}
.logo{display:flex;flex-direction:column;line-height:1;text-decoration:none;gap:3px}
.logo strong{
  font-family:Anton,sans-serif;
  font-size:1.55rem;letter-spacing:.05em;
  color:var(--ink);text-transform:uppercase;
}
.logo strong em{font-style:normal;color:var(--yellow)}
.logo span{font-size:.66rem;font-weight:700;letter-spacing:.3em;color:var(--red);text-transform:uppercase}
nav{display:none;gap:28px}
nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:.95rem;transition:color .2s}
nav a:hover{color:var(--yellow)}
.head-cta{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--yellow);color:#0a0705;text-decoration:none;font-weight:800;
  padding:10px 18px;border-radius:8px;border:2px solid var(--yellow);
  font-size:.95rem;white-space:nowrap;
  box-shadow:4px 4px 0 rgba(0,0,0,.5);
  transition:transform .15s,box-shadow .15s;
}
.head-cta:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 rgba(0,0,0,.6)}
@media(min-width:880px){nav{display:flex}}

/* ---------- HERO ---------- */
.hero{
  position:relative;overflow:hidden;
  height:100vh;min-height:680px;
  display:flex;align-items:center;
  background:var(--bg);
}
/* black base + yellow-orange neon glows (photo 3 vibe) */
.hero-bg{
  position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(1100px 640px at 62% 42%,rgba(255,154,26,.22),transparent 62%),
    radial-gradient(760px 480px at 88% 78%,rgba(255,122,26,.16),transparent 60%),
    radial-gradient(620px 380px at 10% 18%,rgba(255,198,26,.10),transparent 60%),
    linear-gradient(180deg,#0a0705 0%,#150d06 52%,#0a0705 100%);
}
.hero-bg::after{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(2px 2px at 14% 24%,rgba(255,190,80,.75),transparent 100%),
    radial-gradient(1.5px 1.5px at 24% 70%,rgba(255,150,60,.55),transparent 100%),
    radial-gradient(2px 2px at 33% 42%,rgba(255,210,120,.6),transparent 100%),
    radial-gradient(1.5px 1.5px at 44% 82%,rgba(255,170,70,.5),transparent 100%),
    radial-gradient(2px 2px at 56% 28%,rgba(255,200,90,.6),transparent 100%),
    radial-gradient(1.5px 1.5px at 66% 64%,rgba(255,160,60,.55),transparent 100%),
    radial-gradient(2px 2px at 80% 34%,rgba(255,210,120,.5),transparent 100%),
    radial-gradient(1.5px 1.5px at 91% 76%,rgba(255,150,60,.55),transparent 100%);
  opacity:.45;mix-blend-mode:screen;pointer-events:none;
}

.hero-inner{
  position:relative;z-index:2;
  width:100%;max-width:1320px;margin:0 auto;padding:0 28px;
}

/* SMASH — giant outlined yellow word behind the burger */
.smash{
  font-family:Anton,sans-serif;
  font-size:clamp(7rem,23vw,22rem);
  line-height:.84;
  color:transparent;
  -webkit-text-stroke:var(--stroke) var(--yellow);
  letter-spacing:.02em;
  text-transform:uppercase;
  user-select:none;
  display:block;
  text-align:center;
  text-shadow:0 0 42px rgba(255,154,26,.28);
}
.smash-wrap{position:relative;width:100%;margin-top:40px}

/* left text block — "Ascolta il tuo / STOMACO" */
.hero-left{
  position:absolute;left:28px;top:50%;
  transform:translateY(-50%);
  max-width:30vw;z-index:5;
}
.hero-left .lead{
  font-weight:800;font-size:clamp(1.5rem,3vw,2.6rem);
  color:var(--muted);letter-spacing:.01em;line-height:1.12;
}
.hero-left .stomaco{
  font-family:Anton,sans-serif;
  font-size:clamp(3.4rem,8vw,7rem);
  line-height:.92;letter-spacing:.01em;
  color:var(--ink);text-transform:uppercase;margin-top:4px;
  text-shadow:0 4px 34px rgba(0,0,0,.7);
}

/* burger — real asset, sits over the SMASH word */
.burger{
  position:absolute;z-index:4;
  left:55%;top:52%;
  width:clamp(280px,32vw,500px);
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 34px 60px rgba(0,0,0,.75));
}
.burger img{width:100%;height:auto}

/* scroll cue */
.scroll-cue{
  position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  z-index:3;color:var(--muted);font-size:.78rem;font-weight:700;
  letter-spacing:.24em;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.scroll-cue span:last-child{width:1px;height:40px;background:linear-gradient(var(--yellow),transparent)}

@media(max-width:860px){
  .hero{height:auto;min-height:100svh;padding:120px 0 90px}
  .hero-inner{display:flex;flex-direction:column;align-items:center}
  .hero-left{position:static;transform:none;max-width:100%;text-align:center;order:2;margin-top:4vh}
  .smash-wrap{margin-top:0;order:1}
  .burger{position:relative;left:auto;top:auto;transform:none;width:min(72vw,340px);margin:-14vw auto 0;order:3}
  .scroll-cue{display:none}
}
</style>
</head>
<body>
<a class="skip" href="#top">Salta al contenuto</a>

<header id="top">
  <div class="head-in">
    <a class="logo" href="#top" aria-label="Smash Crew, torna all'inizio">
      <strong>Smash<em>Crew</em></strong>
      <span>WeGrillYouChill</span>
    </a>
    <nav aria-label="Navigazione principale">
      <a href="#menu">Menu</a>
      <a href="#metodo">Metodo</a>
      <a href="#recensioni">Recensioni</a>
      <a href="#dove">Dove siamo</a>
    </nav>
    <a class="head-cta" href="https://wa.me/393501684896" target="_blank" rel="noopener">
      Ordina su WhatsApp
    </a>
  </div>
</header>

<main>
  <section class="hero" aria-label="Smash Crew, ascolta il tuo stomaco">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-inner">
      <div class="smash-wrap" aria-hidden="true">
        <span class="smash">Smash</span>
      </div>
      <div class="hero-left">
        <p class="lead">Ascolta<br>il tuo</p>
        <h1 class="stomaco">Stomaco</h1>
      </div>
      <div class="burger">
        <img src="assets/burger.png" alt="Smash burger con cheddar fuso e bacon croccante" width="544" height="622">
      </div>
    </div>
    <div class="scroll-cue" aria-hidden="true">
      <span>Scorri</span>
      <span></span>
    </div>
  </section>
</main>

<script>
// Solid navbar on scroll
const h = document.querySelector('header');
addEventListener('scroll', () => h.classList.toggle('solid', scrollY > 10), { passive: true });
</script>
</body>
</html>
