<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smash Crew — Dove siamo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Kanit:wght@500;700;800&display=swap" rel="stylesheet">

<!-- INIZIO CSS -->
<!-- Leaflet CSS 1.9.4 da CDN con hash SHA-256 corretto (quello più diffuso online è sbagliato e fa bloccare il foglio). -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root {
  --bg: #000000;
  --ink: #ffffff;
  --muted: rgba(255, 255, 255, 0.72);
  --orange: #FF5500;
  --orange-soft: #FF6A1F;
  --font-display: 'Kanit', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --ease-out-expo: cubic-bezier(.16, 1, .3, 1);
  --ease-out-quint: cubic-bezier(.23, 1, .32, 1);
  --ease-out-exit: cubic-bezier(.22, .61, .36, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); -webkit-font-smoothing: antialiased; }

.map-section { max-width: 1120px; margin: 0 auto; padding: 72px 20px 96px; }
.map-section__eyebrow {
  font-family: var(--font-display); font-weight: 700; font-size: 13px;
  letter-spacing: .24em; text-transform: uppercase; color: var(--orange); margin: 0 0 10px;
}
.map-section__title {
  font-family: var(--font-display); font-weight: 800; text-transform: uppercase;
  font-size: clamp(2.2rem, 6vw, 4rem); line-height: 1; margin: 0 0 14px;
}
.map-section__lead { color: var(--muted); max-width: 52ch; margin: 0 0 32px; line-height: 1.55; }

/* ---------- Layout approvato (invariato) ---------- */
.map-frame-shell {
  position: relative; overflow: hidden;
  min-height: 420px;
  /* Altezza fluida: Leaflet la legge all'avvio, quindi invalidateSize + ResizeObserver nel JS. */
  height: clamp(460px, 62vh, 600px);
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: #0d0d0d;
  --bar-h: 130px; /* aggiornato dal JS con l'altezza reale di .map-bar */
}
.map-frame {
  position: absolute; inset: 0; display: block; overflow: hidden; border-radius: inherit;
  isolation: isolate; /* i pane di Leaflet (z-index 400+) restano dentro e non coprono la barra */
}
.map-frame__vignette {
  pointer-events: none; position: absolute; inset: 0; z-index: 2;
  background: radial-gradient(circle at 50% 45%, transparent 35%, rgba(0, 0, 0, 0.55) 100%);
}

.map-bar {
  position: absolute; z-index: 11; left: 16px; right: 16px; bottom: 16px;
  background: rgba(13, 13, 13, 0.72);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px; padding: 18px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap;
}
.map-bar__kicker {
  font-family: var(--font-display); font-weight: 700; font-size: 13px;
  letter-spacing: .2em; text-transform: uppercase; color: var(--orange); margin: 0 0 6px;
}
.map-bar__address {
  font-family: var(--font-display); font-weight: 600; font-size: clamp(1rem, 2.2vw, 1.25rem);
  margin: 0 0 6px; font-style: normal;
}
.map-bar__phone {
  display: inline-flex; align-items: center; gap: 8px; color: var(--muted);
  text-decoration: none; font-size: 15px;
}
.map-bar__phone:hover { color: var(--ink); }
.map-bar .map-cta {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--orange); color: var(--bg);
  font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
  padding: 14px 26px; border-radius: 999px; white-space: nowrap; text-decoration: none;
  transition: background .3s var(--ease-out-quint), transform .3s var(--ease-out-quint), box-shadow .3s var(--ease-out-quint);
}
.map-bar .map-cta:hover {
  background: var(--orange-soft); transform: translateY(-2px); box-shadow: 0 0 24px rgba(255, 85, 0, .55);
}
.map-bar .map-cta:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }

/* ---------- Leaflet: aspetto scuro ---------- */
#smash-map { position: absolute; inset: 0; z-index: 1; background: #0d0d0d; font-family: var(--font-body); outline: none; }
.leaflet-container { background: #0d0d0d; }
.leaflet-bar { border: 1px solid rgba(255,255,255,.14) !important; box-shadow: none !important; border-radius: 12px !important; overflow: hidden; }
.leaflet-bar a, .leaflet-bar a:hover {
  background: rgba(13,13,13,.82); color: rgba(255,255,255,.9); border-bottom-color: rgba(255,255,255,.1);
}
.leaflet-bar a:hover { background: var(--orange); color: var(--bg); }
.leaflet-top.leaflet-right { top: 4px; right: 4px; }

/* Attribuzione Esri / OpenStreetMap: sempre visibile, spostata sopra la barra informativa. */
.leaflet-bottom.leaflet-right { bottom: calc(var(--bar-h) + 16px); }
.leaflet-control-attribution {
  background: rgba(13,13,13,.78) !important; color: rgba(255,255,255,.62) !important;
  font-size: 11px; padding: 2px 8px; border-radius: 8px 0 0 8px;
}
.leaflet-control-attribution a { color: rgba(255,255,255,.85) !important; }

/* ---------- Pin a goccia ---------- */
.sc-pin { background: none; border: 0; overflow: visible; }
.sc-pin__halo {
  position: absolute; left: 50%; top: 42%; width: 96px; height: 96px; transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(255,85,0,.55) 0%, rgba(255,85,0,.18) 45%, rgba(255,85,0,0) 70%);
  pointer-events: none;
}
.sc-pin__ground {
  position: absolute; left: 50%; bottom: -3px; width: 22px; height: 7px; margin-left: -11px;
  border-radius: 50%; background: rgba(0,0,0,.65); filter: blur(2px);
}
.sc-pin__ring {
  position: absolute; left: 50%; bottom: 0; width: 72px; height: 72px; margin: 0 0 -36px -36px;
  border-radius: 50%; border: 1.5px solid rgba(255,85,0,.75); opacity: 0; pointer-events: none;
  animation: scPinRing 2.4s var(--ease-out-exit) infinite;
}
.sc-pin__ring--late { animation-delay: 1.2s; } /* sfasati di mezzo ciclo */
.sc-pin__drop {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible;
  filter: drop-shadow(0 0 8px rgba(255,85,0,.85)) drop-shadow(0 5px 5px rgba(0,0,0,.65));
}
.sc-pin__body { fill: var(--orange); }
.sc-pin__hole { fill: #0d0d0d; }

@keyframes scPinRing {
  0%   { opacity: .9; transform: scale(.15); }
  100% { opacity: 0;  transform: scale(1.7); }
}
@media (prefers-reduced-motion: reduce) {
  .sc-pin__ring { animation: none; opacity: 0; display: none; }
  .map-bar .map-cta { transition: none; }
  .map-bar .map-cta:hover { transform: none; }
}

/* ---------- Fallback se Leaflet non carica ---------- */
.map-fallback {
  position: absolute; inset: 0; z-index: 3; display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; text-align: center; padding: 24px 24px 190px; color: var(--muted);
  background:
    radial-gradient(circle at 50% 40%, rgba(255,85,0,.14), transparent 55%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 44px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 44px),
    #0d0d0d;
}
.map-fallback a { color: var(--orange); font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
.map-frame-shell.is-fallback .map-fallback { display: flex; }
.map-frame-shell.is-fallback #smash-map { display: none; }

@media (max-width: 640px) {
  .map-section { padding: 48px 14px 72px; }
  .map-frame-shell { height: 540px; }
  .map-bar { left: 10px; right: 10px; bottom: 10px; padding: 16px; flex-direction: column; align-items: stretch; }
  .map-bar .map-cta { width: 100%; }
  .leaflet-bottom.leaflet-right { bottom: calc(var(--bar-h) + 10px); }
}
</style>
<!-- FINE CSS -->
</head>
<body>

<!-- INIZIO HTML -->
<section class="map-section" id="dove-siamo" aria-labelledby="map-title">
  <p class="map-section__eyebrow">Smash Crew</p>
  <h2 class="map-section__title" id="map-title">Dove siamo</h2>
  <p class="map-section__lead">Vieni a trovarci a Civitanova Marche: trascina la mappa, il pin resta piantato sulla nostra strada.</p>

  <div class="map-frame-shell" id="map-shell">
    <div class="map-frame">
      <div id="smash-map" role="region" aria-label="Mappa interattiva: Smash Crew, Via Regina Elena 56, Civitanova Marche"></div>
      <div class="map-frame__vignette"></div>
      <div class="map-fallback" role="note">
        <span>La mappa non è disponibile in questo momento.</span>
        <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Via%20Regina%20Elena%2056%2C%2062012%20Civitanova%20Marche%20MC" target="_blank" rel="noopener">Apri le indicazioni</a>
      </div>
    </div>

    <div class="map-bar" id="map-bar">
      <div class="map-bar__text">
        <p class="map-bar__kicker">Smash Crew · Sede unica</p>
        <address class="map-bar__address">Via Regina Elena 56, 62012 Civitanova Marche (MC)</address>
        <a class="map-bar__phone" href="tel:+393501684896">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>
          350 168 4896
        </a>
      </div>
      <a class="map-cta" href="https://www.google.com/maps/dir/?api=1&amp;destination=Via%20Regina%20Elena%2056%2C%2062012%20Civitanova%20Marche%20MC" target="_blank" rel="noopener">Indicazioni</a>
    </div>
  </div>
</section>
<!-- FINE HTML -->

<!-- INIZIO JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
  var shell = document.getElementById('map-shell');
  var bar = document.getElementById('map-bar');

  // Altezza reale della barra: serve a tenere l'attribuzione visibile sopra di essa.
  function syncBarHeight() { shell.style.setProperty('--bar-h', bar.offsetHeight + 'px'); }
  syncBarHeight();

  // Fallback: CDN di Leaflet non raggiunto (o bloccato) -> riquadro scuro con link funzionante.
  if (typeof window.L === 'undefined') {
    shell.classList.add('is-fallback');
    if (window.ResizeObserver) new ResizeObserver(syncBarHeight).observe(bar);
    return;
  }

  // PROVVISORIO: coordinate del segmento "Centro" di Via Regina Elena.
  // Il civico 56 non è confermato dal geocoder; sostituire con le coordinate verificate sul posto.
  var LOCALE = [43.3125900, 13.7249566];
  // PROVVISORIO: zoom 17 scelto per mostrare l'isolato; va rivisto quando il civico è confermato.
  var ZOOM = 17;

  var map = L.map('smash-map', {
    center: LOCALE,
    zoom: ZOOM,
    minZoom: 12,
    maxZoom: 18,
    zoomControl: false,
    scrollWheelZoom: false, // evita di rubare lo scroll della pagina; si attiva dopo un clic sulla mappa
    attributionControl: true
  });
  L.control.zoom({ position: 'topright' }).addTo(map);

  var attribution =
    'Tiles &copy; <a href="https://www.esri.com/" target="_blank" rel="noopener">Esri</a> — Esri, HERE, Garmin, &copy; ' +
    '<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors';

  // Esri World Dark Gray (già scuro, senza API key). Livello nativo massimo: 16.
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: attribution, maxNativeZoom: 16, maxZoom: 18
  }).addTo(map);

  // Layer di testo abbinato (nomi di strade e luoghi).
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
    maxNativeZoom: 16, maxZoom: 18
  }).addTo(map);

  // Pin a goccia: 44x44, ancorato in fondo (punta) -> la punta tocca le coordinate, il resto sale sopra.
  var pinHtml =
    '<span class="sc-pin__halo"></span>' +
    '<span class="sc-pin__ground"></span>' +
    '<span class="sc-pin__ring"></span>' +
    '<span class="sc-pin__ring sc-pin__ring--late"></span>' +
    '<svg class="sc-pin__drop" viewBox="0 0 44 44" aria-hidden="true" focusable="false">' +
      '<path class="sc-pin__body" d="M22 44C22 44 5 27.500 5 16.500a17 17 0 1 1 34 0C39 27.500 22 44 22 44Z"/>' +
      '<circle class="sc-pin__hole" cx="22" cy="16.500" r="6.500"/>' +
    '</svg>';

  var icon = L.divIcon({
    className: 'sc-pin',
    html: pinHtml,
    iconSize: [44, 44],
    iconAnchor: [22, 44]
  });
  var marker = L.marker(LOCALE, { icon: icon, interactive: false, keyboard: false, title: 'Smash Crew' }).addTo(map);

  // Zoom con rotellina solo dopo un clic sulla mappa.
  map.on('click focus', function () { map.scrollWheelZoom.enable(); });
  map.on('mouseout blur', function () { map.scrollWheelZoom.disable(); });

  // Il contenitore ha altezza clamp(): ricalcolo al primo frame e a ogni resize.
  requestAnimationFrame(function () { map.invalidateSize(); });
  window.addEventListener('load', function () { map.invalidateSize(); });
  if (window.ResizeObserver) {
    new ResizeObserver(function () { syncBarHeight(); map.invalidateSize(); }).observe(shell);
    new ResizeObserver(syncBarHeight).observe(bar);
  } else {
    window.addEventListener('resize', function () { syncBarHeight(); map.invalidateSize(); });
  }

  // Esposti per le verifiche (Playwright / console).
  window.smashMap = map;
  window.smashMarker = marker;
})();
</script>
<!-- FINE JS -->
</body>
</html>
