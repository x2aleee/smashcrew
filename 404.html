<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Pagina non trovata — Smash Crew</title>
  <style>
    :root {
      --accent: #FF5500;
      --accent-glow: rgba(255, 85, 0, 0.35);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #000000;
      color: #ffffff;
      font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .wrap { max-width: 520px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
    .code {
      font-size: clamp(72px, 18vw, 140px); font-weight: 900; line-height: 1;
      letter-spacing: -0.02em; color: var(--accent);
      text-shadow: 0 0 40px var(--accent-glow);
    }
    h1 { font-size: clamp(20px, 4.4vw, 28px); font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
    p { color: rgba(255, 255, 255, 0.72); font-size: 15px; line-height: 1.6; }
    a.btn {
      margin-top: 8px; display: inline-block; background: var(--accent); color: #000000;
      font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; font-size: 13px;
      padding: 14px 26px; border-radius: 999px; text-decoration: none;
    }
    a.btn:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="code" aria-hidden="true">404</div>
    <h1>Pagina non trovata</h1>
    <p>Il link che hai seguito non esiste piu' o e' stato spostato. Torna alla home per continuare a ordinare da Smash Crew.</p>
    <a class="btn" href="/">Torna alla home</a>
  </main>
</body>
</html>
