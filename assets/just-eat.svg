<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Just Eat">
  <defs>
    <!-- Stencil negativo: il rettangolo bianco rende visibile il badge, le due
         righe di testo nere lo nascondono, quindi "just eat" resta ritagliato
         e lascia trasparire il fondo scuro della card. -->
    <mask id="justeat-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect width="120" height="120" rx="27" fill="#FFFFFF"/>
      <text x="60" y="52" text-anchor="middle" font-family="'Arial Rounded MT Bold','Trebuchet MS',Arial,Helvetica,sans-serif" font-size="34" font-weight="800" letter-spacing="-1.5" fill="#000000">just</text>
      <text x="60" y="92" text-anchor="middle" font-family="'Arial Rounded MT Bold','Trebuchet MS',Arial,Helvetica,sans-serif" font-size="34" font-weight="800" letter-spacing="-1.5" fill="#000000">eat</text>
    </mask>
  </defs>
  <rect width="120" height="120" rx="27" fill="#FF5500" mask="url(#justeat-cut)"/>
</svg>
